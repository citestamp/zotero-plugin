<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- CiteStamp mark: a wax-seal ring with the CS monogram, in brand oxblood.
       Loaded by the plugin via rootURI (the documented Zotero way); a concrete
       fill keeps it visible whether Zotero shows the icon as-is or recolors it.
       The seal is inset ~2.5px from every edge so it never clips inside the
       sidenav / header icon box. -->
  <path fill="#b5402a" fill-rule="evenodd"
        d="M12 2.5A9.5 9.5 0 1 0 12 21.5 9.5 9.5 0 0 0 12 2.5Zm0 1.9A7.6 7.6 0 1 1 12 19.6 7.6 7.6 0 0 1 12 4.4Z"/>
  <text x="12" y="12.2" text-anchor="middle" dominant-baseline="central"
        font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="9.4"
        fill="#b5402a">CS</text>
</svg>
